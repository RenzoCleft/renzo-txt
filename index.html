<style>
/* Layout: uno schermo televideo 40x25 a caratteri, telecomando accanto (sotto su telefono). Un solo look scuro. */
:root{
  --room:#0c0d10; --bezel:#17181d; --key:#23252c; --key-hi:#30333c; --label:#c9cbd3;
  --t-k:#000000; --t-r:#ff3b30; --t-g:#28e04a; --t-y:#ffec1a; --t-b:#1f33ff; --t-m:#ff4dff; --t-c:#10e4ff; --t-w:#f2f2f2;
  --font:'VT323', 'Courier New', monospace;
  color-scheme: dark;
}
body{background:var(--room);color:var(--t-w);font-family:var(--font);}
.wrap{max-width:1040px;margin:0 auto;padding-block:24px 40px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;gap:24px;align-items:flex-start;justify-content:center;}
.tv{flex:1 1 auto;min-width:0;max-width:820px;display:flex;flex-direction:column;align-items:stretch;}
.cab{background:linear-gradient(180deg,#3a3c43 0%,#2a2b31 55%,#1f2025 100%);border-radius:30px;padding:30px 30px 0;box-shadow:inset 0 2px 0 rgba(255,255,255,.12), inset 0 -3px 0 rgba(0,0,0,.4), 0 24px 40px rgba(0,0,0,.55);}
.glass{background:#050506;padding:16px;border-radius:30px;box-shadow:inset 0 0 0 3px #15161a, inset 0 6px 18px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.08);}
.screen{position:relative;background:var(--t-k);overflow:hidden;border-radius:26px / 34px;box-shadow:0 0 30px rgba(120,160,255,.08);}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%), linear-gradient(160deg, rgba(255,255,255,.07) 0%, transparent 28%), repeating-linear-gradient(to bottom, rgba(255,255,255,.035) 0 1px, transparent 1px 3px);}
.panel{display:flex;align-items:center;gap:18px;padding:16px 6px 18px;}
.grille{flex:1;height:34px;border-radius:6px;background:repeating-linear-gradient(90deg,#141518 0 4px,transparent 4px 9px);opacity:.9;}
.plate{font-size:20px;letter-spacing:.2em;color:#a9abb4;padding:0 4px;white-space:nowrap;}
.knob{width:38px;height:38px;flex:none;border-radius:50%;background:conic-gradient(from 20deg,#55575f,#2a2b30,#4a4c54,#232428,#55575f);box-shadow:inset 0 0 0 3px #1b1c20,0 2px 3px rgba(0,0,0,.5);position:relative;}
.knob::after{content:"";position:absolute;left:50%;top:5px;width:3px;height:10px;margin-left:-1.5px;border-radius:2px;background:#c9cbd3;}
.knob.b{transform:rotate(110deg);}
.led{width:9px;height:9px;flex:none;border-radius:50%;background:#ff3b30;box-shadow:0 0 8px 2px rgba(255,59,48,.7);}
.feet{display:flex;justify-content:space-between;padding:0 14%;}
.feet i{display:block;width:70px;height:14px;background:#17181c;border-radius:0 0 8px 8px;}
.inner{position:absolute;left:0;top:0;transform-origin:0 0;font-size:var(--fs);line-height:var(--lh);padding:0 1ch;width:40ch;box-sizing:content-box;}
.row{height:var(--lh);white-space:pre;overflow:hidden;position:relative;}
#hdr{cursor:pointer;}
#hdr:hover span{text-decoration:underline;}
.row.dh{height:calc(var(--lh) * 2);}
.row.dh > .dhi{display:inline-block;transform:scaleY(2);transform-origin:0 0;white-space:pre;}
.row svg{display:block;width:100%;height:100%;}
.ph{color:var(--t-m);}
.bgrow .ph{color:inherit;}
.pg,.fx{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;line-height:inherit;}
.pg:hover,.fx:hover{text-decoration:underline;}
.pg:focus-visible,.fx:focus-visible{outline:2px solid var(--t-w);outline-offset:-1px;}
.bar{display:inline-block;vertical-align:middle;width:38ch;height:.25em;background:#2a2a2a;}
.bar > i{display:block;height:100%;background:var(--t-w);width:0;}
.flash{animation:fl 1s steps(1) infinite;}
@keyframes fl{50%{visibility:hidden;}}

.remote{flex:0 0 212px;background:var(--bezel);border-radius:28px;padding:20px 18px 24px;display:flex;flex-direction:column;gap:14px;}
.remote .brand{text-align:center;font-size:18px;color:var(--label);letter-spacing:.12em;}
.disp{background:#000;border-radius:6px;text-align:center;font-size:30px;color:var(--t-y);padding:2px 0;font-variant-numeric:tabular-nums;}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.k{font:inherit;font-size:24px;color:var(--t-w);background:var(--key);border:0;border-radius:12px;min-height:46px;cursor:pointer;}
.k:hover{background:var(--key-hi);}
.k:focus-visible{outline:2px solid var(--t-y);outline-offset:2px;}
.k.small{font-size:18px;letter-spacing:.06em;color:var(--label);}
.k svg{display:block;margin:0 auto;}
.fast{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.fast .k{min-height:44px;border-radius:8px;}
.fast .k.r{background:var(--t-r);} .fast .k.g{background:var(--t-g);} .fast .k.y{background:var(--t-y);} .fast .k.c{background:var(--t-c);}
.duo{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px;}
.hint{font-size:17px;line-height:1.2;color:#9a9ca6;text-align:center;margin:0;}
@media (max-width: 760px){
  .wrap{flex-direction:column;align-items:stretch;gap:12px;padding-block:12px 12px;}
  .tv{max-width:none;}
  .cab{padding:14px 14px 0;border-radius:20px;}
  .glass{padding:8px;border-radius:20px;}
  .screen{border-radius:14px / 18px;}
  .panel{gap:12px;padding:10px 2px 12px;}
  .grille{height:22px;}
  .plate{font-size:16px;}
  .knob{width:28px;height:28px;}
  .feet i{width:44px;height:10px;}
  .remote{flex:none;border-radius:18px;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);grid-template-rows:repeat(4,44px);gap:8px;padding:10px;}
  .remote .brand,.remote .hint{display:none;}
  .pad{grid-column:1;grid-row:1 / 5;grid-template-rows:repeat(4,44px);gap:8px;}
  .disp{grid-column:2;grid-row:1;font-size:22px;display:flex;align-items:center;justify-content:center;}
  .duo{grid-column:2;grid-row:2;gap:8px;}
  .fast{grid-column:2;grid-row:3 / 5;grid-template-columns:1fr 1fr;grid-template-rows:repeat(2,44px);}
  .k,.fast .k{min-height:44px;border-radius:10px;}
  .pad .k{font-size:22px;}
  .duo .k{font-size:15px;letter-spacing:.02em;}
}
@media (prefers-reduced-motion: reduce){ .flash{animation:none;} }
</style>

    <div class="fast">

    </div>
  </div>
</div>

<script>

    problema: 'I started from the brand book and turned it into modular email blocks, then handed them off to the developers on Mapp.', ruolo: 'UI Designer (Email & CRM)', con: 'PM, client and developers' },
  { titolo: 'SPA', nome: 'Pitch, desktop site', cliente: 'thermal spa group', kpi: '',

    problema: 'Pitch for the wellness and luxury sector: redesign of an outdated landing page packed with content. I simplified it as much as I could, module by module, to cut the cognitive load for visitors.', ruolo: 'UX/UI and redesign of each module, desktop and mobile', con: 'a team of designers and developers' }
];
var PROGETTI_ALL = { it: PROGETTI_IT, en: PROGETTI_IT.map(function(p, i){ var o = {}, k; for (k in p) o[k] = p[k]; for (k in PROGETTI_EN[i]) o[k] = PROGETTI_EN[i][k]; return o; }) };
var LANG = 'it', LANG_SAVED = false;
try { var sv = localStorage.getItem('renzo-txt-lang'); if (sv === 'it' || sv === 'en') { LANG = sv; LANG_SAVED = true; } } catch (e) {}
var NUMERI, PROGETTI, FAST, PAGES, ORDER = [100, 101, 102, 200, 300, 301, 302, 303, 304, 305, 400];

/* ===== Mosaico (lettere a blocchi) ===== */
var GL = {
  R:['11110','10001','10001','11110','10100','10010','10001'], E:['11111','10000','10000','11110','10000','10000','11111'],

  '4':['00010','00110','01010','10010','11111','00010','00010'], '5':['11111','10000','11110','00001','00001','10001','01110'],
  '6':['00110','01000','10000','11110','10001','10001','01110'], '7':['11111','00001','00010','00100','01000','01000','01000'],
  '8':['01110','10001','10001','01110','10001','10001','01110'], '9':['01110','10001','10001','01111','00001','00010','01100'],

  '+':['00000','00100','00100','11111','00100','00100','00000']
};
function col(c){ return 'var(--t-' + c + ')'; }
function mosaic(str, rows, fg, bg, scale){
  var H = rows * 3, s = scale || 3;
  while (s > 1 && (str.length * 6 * s - s) > 78) s--;
  var w = str.length * 6 * s - s, h = 7 * s;
  var ox = Math.floor((80 - w) / 2), oy = Math.floor((H - h) / 2), out = '';
  for (var i = 0; i < str.length; i++) {
    var g = GL[str[i]]; if (!g) continue;
    for (var y = 0; y < 7; y++) {
      var x = 0;
      while (x < 5) {
        if (g[y][x] === '1') { var x2 = x; while (x2 < 5 && g[y][x2] === '1') x2++;
          out += '<rect x="' + (ox + (i * 6 + x) * s) + '" y="' + (oy + y * s) + '" width="' + ((x2 - x) * s) + '" height="' + s + '"/>'; x = x2; }
        else x++;
      }
    }
  }
  return '<svg viewBox="0 0 80 ' + H + '" preserveAspectRatio="none" shape-rendering="crispEdges" aria-hidden="true">' +
    '<rect width="80" height="' + H + '" style="fill:' + col(bg || 'k') + '"/><g style="fill:' + col(fg) + '">' + out + '</g></svg>';
}

/* ===== Righe: codici colore tipo televideo ^y testo giallo, ^B sfondo blu, ^d doppia altezza ===== */
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function linkify(t){
  return t.split(/(\[[^\]]*\])/).map(function(part){
    if (/^\[.*\]$/.test(part)) return '<span class="ph">' + esc(part) + '</span>';
    var links = [];
    part = part.replace(/[\w-]+\.pdf|[\w.+-]+@[\w-]+(?:\.[\w-]+)+|(?:[\w-]+\.)+(?:com|net|it|io|design)(?:\/[\w\-\/.]*)?/g, function(m){
      var href = /\.pdf$/.test(m) ? m : (m.indexOf('@') > 0 ? 'mailto:' + m : 'https://' + m);
      links.push('<a class="pg" href="' + href + '" target="_blank" rel="noopener">' + esc(m) + '</a>');
      return '\u0000' + (links.length - 1) + '\u0000';
    });
    return esc(part).replace(/\b(000|[1-8]\d\d)\b/g, function(m){ return PAGES[+m] ? '<button type="button" class="pg" data-go="' + m + '">' + m + '</button>' : m; })
      .replace(/\u0000(\d+)\u0000/g, function(_, i){ return links[+i]; });
  }).join('');
}
function parseRow(s){
  var fg = 'w', bg = null, rowBg = null, dh = false, html = '', buf = '', i = 0, started = false;
  function flush(){ if (!buf) return; html += '<span style="color:' + col(fg) + (bg && bg !== rowBg ? ';background:' + col(bg) : '') + '">' + linkify(buf) + '</span>'; buf = ''; }
  while (i < s.length) {
    if (s[i] === '^' && i + 1 < s.length) {
      var c = s[i + 1]; flush();
      if (c === 'd') dh = true;
      else if (c === c.toUpperCase()) { bg = c.toLowerCase(); if (!started) rowBg = bg; }
      else fg = c;
      i += 2; continue;
    }
    started = true; buf += s[i]; i++;
  }
  flush();
  return { html: html, dh: dh, rowBg: rowBg };
}
function wrap(text, code, width){
  var w = width || 38, toks = text.match(/\[[^\]]*\]\S*|\S+/g) || [], lines = [], cur = '';
  toks.forEach(function(t){ if ((cur + ' ' + t).trim().length > w) { lines.push(cur); cur = t; } else cur = (cur ? cur + ' ' : '') + t; });
  if (cur) lines.push(cur);
  return lines.map(function(l, j){ return (code || '^w') + ' ' + l; });
}
function dots(label, p, lead, numCol){
  var left = lead + label + ' ', right = ' ' + p;
  var n = Math.max(2, 39 - left.length - right.length);
  return '^w' + left + '^c' + Array(n + 1).join('.') + '^' + (numCol || 'y') + right;
}

function fit23(r){
  var n = r.reduce(function(a, x){ return a + (typeof x === 'string' && x.indexOf('^d') === 0 ? 2 : 1); }, 0);
  if (n > 23 && r[r.length - 2] === '') r.splice(r.length - 2, 1);

}

  PAGES = {

  ]; } },
  200: { name: T('Il mio 2026', 'My 2026'), sub: true, rows: function(){ var d = NUMERI[state.sub]; return [].concat(
    [T('^d^y IL MIO 2026                 ^w', '^d^y MY 2026                     ^w') + (state.sub + 1) + '/' + NUMERI.length, ''],

  ); } },
  300: { name: T('Progetti', 'Projects'), rows: function(){

    PROGETTI.forEach(function(p){ r.push('^w ' + p.p + '  ' + p.nome); if (p.kpi) r = r.concat(wrap(p.kpi, '^g     ', 33)); });

    dots(T('Torna all\'indice', 'Back to the index'), 100, ' ')
  ]; } }
  };
  PROGETTI.forEach(function(p, j){
    PAGES[p.p] = { name: p.titolo, rows: function(){ return fit23([].concat(
      ['^d^y ' + p.titolo + '           ^w' + (j + 1) + '/' + PROGETTI.length, ].concat(wrap(p.nome + ' · ' + p.cliente, '^c'), (p.kpi ? ['', T('^y RISULTATO', '^y RESULT')].concat(wrap(p.kpi, '^g')) : [])), ['', T('^y PROBLEMA', '^y CHALLENGE')], wrap(p.problema), ['',
       T('^y RUOLO', '^y ROLE')], wrap(p.ruolo), [T('^y CON', '^y TEAM')], wrap(p.con), [

       j < PROGETTI.length - 1 ? dots(T('Vai al progetto successivo', 'Go to the next project'), PROGETTI[j + 1].p, ' ') : dots(T('Vai ai Contatti', 'Go to Contact'), 400, ' ')]
    )); }, fast: [[300, T('Progetti', 'Projects')], [PROGETTI[(j + PROGETTI.length - 1) % PROGETTI.length].p, T('Pag. prec.', 'Prev. page')], [PROGETTI[(j + 1) % PROGETTI.length].p, T('Pag. succ.', 'Next page')], [400, T('Contatti', 'Contact')]] };

function missing(n){ return { name: T('Pagina ', 'Page ') + n, rows: function(){ return [
  T('^d^r PAGINA NON IN ONDA', '^d^r PAGE NOT ON AIR'), '', T('^w La pagina ' + n + ' non esiste.', '^w Page ' + n + ' does not exist.'), '',
  dots(T('Indice', 'Index'), 100, ' '), dots(T('Progetti', 'Projects'), 300, ' '), dots(T('Contatti', 'Contact'), 400, ' '), '',
  dots(T('Lingua / Language', 'Language / Lingua'), '000', ' ')
]; } }; }
buildPages();

/* ===== Stato e disegno ===== */
var state = { page: 100, typed: '', sub: 0, subStart: 0, hold: false, hunting: false };
var inner = document.getElementById('inner'), screen = document.getElementById('screen'), disp = document.getElementById('disp');
var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var fmtD, mkD = function(){ fmtD = new Intl.DateTimeFormat(T('it-IT', 'en-GB'), { timeZone: 'Europe/Rome', weekday: 'short', day: '2-digit', month: 'short' }); };
mkD();
var fmtT = new Intl.DateTimeFormat('it-IT', { timeZone: 'Europe/Rome', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });

function pad3(n){ return ('00' + n).slice(-3); }
function headerHTML(shown){
  var now = new Date(); shown = pad3(shown);
  var p = state.typed ? ('P' + (state.typed + '---').slice(0, 3)) : ('P' + pad3(state.page));
  var d = fmtD.format(now).replace('.', '').replace(',', '').slice(0, 10);
  while (d.length < 10) d += ' ';
  return '<span style="color:var(--t-w)">' + p + ' </span><span style="color:var(--t-y)">RENZO TXT </span>' +
    '<span style="color:var(--t-w)">' + shown + ' ' + d + ' </span><span style="color:var(--t-y)">' + fmtT.format(now) + '</span>';
}
function pageDef(n){ return PAGES[n] || missing(n); }
function fastFor(n){ return (PAGES[n] && PAGES[n].fast) || FAST; }
function render(){
  var def = pageDef(state.page), rows = def.rows(), out = [], used = 0;
  out.push('<div class="row" id="hdr">' + headerHTML(state.page) + '</div>');
  rows.forEach(function(r){
    if (typeof r === 'string') {
      var p = parseRow(r), st = p.rowBg ? ' style="background:' + col(p.rowBg) + '"' : '', cls = 'row' + (p.dh ? ' dh' : '') + (p.rowBg ? ' bgrow' : '');
      out.push('<div class="' + cls + '"' + st + '>' + (p.dh ? '<span class="dhi">' + p.html + '</span>' : p.html) + '</div>');
      used += p.dh ? 2 : 1;
    } else if (r.mosaic != null) {
      out.push('<div class="row" style="height:calc(var(--lh) * ' + r.rows + ')"' + (r.id ? ' id="' + r.id + '"' : '') + ' data-fg="' + r.fg + '">' + mosaic(r.mosaic, r.rows, r.fg, r.bg, r.scale) + '</div>');
      used += r.rows;
    } else if (r.link) {
      out.push('<div class="row"> <a class="pg" style="color:var(--t-c)" href="' + esc(r.link) + '" target="_blank" rel="noopener">' + esc(r.label) + '</a></div>'); used += 1;
    } else if (r.lang) {
      out.push('<div class="row"> <span style="color:var(--t-y)">' + r.key + '  </span><button type="button" class="pg" style="color:var(--t-c)" data-go="' + r.lang + '">' + esc(r.label) + '</button></div>'); used += 1;
    } else if (r.langs) {
      out.push('<div class="row"> ' + [['it', 'Italiano'], ['en', 'English']].map(function(x){ var on = x[0] === LANG;
        return '<button type="button" class="pg" data-go="' + x[0] + '" style="color:' + col(on ? 'y' : 'c') + '"' + (on ? ' aria-current="true"' : '') + '>' + (on ? '\u25ba' : ' ') + x[1] + '</button>'; }).join('   ') + '</div>'); used += 1;
    } else if (r.bar) {
      out.push('<div class="row"> <span class="bar"><i id="bar"></i></span></div>'); used += 1;
    }
  });
  while (used < 23) { out.push('<div class="row"></div>'); used++; }
  var fs = fastFor(state.page), cs = ['r', 'g', 'y', 'c'], f = '';
  fs.forEach(function(x, j){ var lab = x[1].slice(0, 10), gap = Array(Math.max(2, 11 - lab.length)).join(' '); f += '<button type="button" class="fx" data-go="' + x[0] + '" style="color:' + col(cs[j]) + '">' + esc(lab) + '</button>' + gap; });
  out.push('<div class="row">' + f + '</div>');
  inner.innerHTML = out.join('');
  disp.textContent = state.typed ? ('P' + (state.typed + '---').slice(0, 3)) : ('P' + pad3(state.page));
  screen.setAttribute('aria-label', T('Schermo televideo, pagina ', 'Teletext screen, page ') + pad3(state.page) + ': ' + def.name);
  if (def.sub) tick(true);
}

function hashFor(n){ return '#p' + pad3(n) + (LANG === 'en' ? '/en' : ''); }
function setLang(l, save){
  LANG = l; if (save !== false) { try { localStorage.setItem('renzo-txt-lang', l); } catch (e) {} }
  buildPages(); mkD(); applyUI();
}
function applyUI(){
  document.documentElement.lang = LANG;
  var q = function(id){ return document.getElementById(id); }, a = function(el, v){ if (el) el.setAttribute('aria-label', v); };
  a(screen, T('Schermo televideo', 'Teletext screen'));
  a(document.querySelector('.remote'), T('Telecomando', 'Remote control'));
  var br = document.querySelector('.remote .brand'); if (br) br.textContent = T('TELECOMANDO', 'REMOTE');
  a(q('prev'), T('Pagina precedente', 'Previous page')); a(q('next'), T('Pagina successiva', 'Next page'));
  a(q('home'), T('Indice, pagina 100', 'Index, page 100'));
  var fx = document.querySelectorAll('.fast .k'), fl = T(['Tasto rosso', 'Tasto verde', 'Tasto giallo', 'Tasto azzurro'], ['Red key', 'Green key', 'Yellow key', 'Cyan key']);
  for (var i = 0; i < fx.length; i++) a(fx[i], fl[i]);
  var h = q('hold'); a(h, state.hold ? T('Riprendi i numeri', 'Resume the numbers') : T('Metti in pausa i numeri', 'Pause the numbers'));
  var lk = q('lang'); if (lk) { lk.textContent = T('EN', 'IT'); a(lk, T('Switch to English', 'Passa all\u2019italiano')); }
}
function go(n){
  if (n === 'it' || n === 'en') { var back = state.page === 0 ? 100 : state.page; setLang(n); state.typed = ''; state.page = back; if (back === 200) { state.sub = 0; state.subStart = performance.now(); }
    try { history.replaceState(null, '', hashFor(back)); } catch (e) {} render(); return; }
  n = +n; state.typed = '';
  if (n === state.page && !state.hunting) { render(); return; }
  try { history.replaceState(null, '', hashFor(n)); } catch (e) {}
  if (n === 200) { state.sub = 0; state.subStart = performance.now(); }
  if (reduce) { state.page = n; render(); return; }
  state.hunting = true;
  var steps = 7, k = 0, from = state.page;
  (function hunt(){
    k++;
    var shown = k < steps ? (from + Math.round((n - from) * k / steps) + (k % 2 ? 7 : 0)) : n;
    var h = document.getElementById('hdr'); if (h) { state.typed = ''; h.innerHTML = headerHTML(n === 0 ? 0 : Math.max(100, Math.min(899, shown))); }
    if (k < steps) setTimeout(hunt, 45);
    else { state.hunting = false; state.page = n; render(); }
  })();
}
function digit(d){
  if (state.hunting) return;
  if (state.page === 0 && !state.typed && (d === '1' || d === '2')) { go(d === '1' ? 'it' : 'en'); return; }
  state.typed += d;
  disp.textContent = 'P' + (state.typed + '---').slice(0, 3);
  var h = document.getElementById('hdr'); if (h) h.innerHTML = headerHTML(state.page);
  if (state.typed.length === 3) { var n = state.typed; setTimeout(function(){ go(n); }, 120); }
}
function step(dir){
  if (state.page === 200 && dir > 0 && state.sub < NUMERI.length - 1) { nextSub(); return; }
  var i = ORDER.indexOf(state.page); if (i < 0) i = 0;
  go(ORDER[(i + dir + ORDER.length) % ORDER.length]);
}
function nextSub(){ state.sub = (state.sub + 1) % NUMERI.length; state.subStart = performance.now(); render(); }

var SUB_MS = 6500;
var HOLD_PAUSE = '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>', HOLD_PLAY = '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5l12 7-12 7z"/></svg>';
function tick(first){
  if (state.page !== 200) return;
  var now = performance.now(), d = NUMERI[state.sub];
  if (state.hold) state.subStart = now - Math.min(now - state.subStart, SUB_MS - 1);
  var t = (now - state.subStart) / SUB_MS;
  if (t >= 1) { if (state.sub < NUMERI.length - 1) { nextSub(); return; } t = 1; }
  var k = reduce ? 1 : Math.min(1, t * 3.5), e = 1 - Math.pow(1 - k, 3);
  var el = document.getElementById('num');
  if (el) { var val = String(Math.round(d.n * e)) + (e >= 1 ? (d.suf || '') : ''); if (el.getAttribute('data-v') !== val) { el.setAttribute('data-v', val); el.innerHTML = mosaic(val, 7, d.c, 'k', 3); } }
  var b = document.getElementById('bar'); if (b) b.style.width = (t * 100).toFixed(1) + '%';
}
function clockLoop(){
  if (!state.hunting) { var h = document.getElementById('hdr'); if (h) h.innerHTML = headerHTML(state.page); }
}
(function loop(){ tick(); requestAnimationFrame(loop); })();
setInterval(clockLoop, 1000);

/* ===== Adatta lo schermo: 40x25 caratteri, glifi allargati come in tv ===== */
var ratio = 0.5;
function measure(){
  var s = document.createElement('span');
  s.style.cssText = 'position:absolute;visibility:hidden;font-family:' + getComputedStyle(document.body).getPropertyValue('--font') + ';font-size:100px;white-space:pre';
  s.textContent = '0000000000'; document.body.appendChild(s);
  ratio = s.getBoundingClientRect().width / 1000 || 0.5; s.remove();
}
function fit(){
  var W = screen.parentElement.clientWidth - parseFloat(getComputedStyle(screen.parentElement).paddingLeft) * 2;
  function apply(fs){
    screen.style.height = (fs * 25) + 'px';
    inner.style.setProperty('--fs', fs + 'px'); inner.style.setProperty('--lh', fs + 'px');
    inner.style.transform = 'scaleX(' + (W / (42 * ratio * fs)) + ')';
  }
  var fs = Math.max(W * 0.75 / 25, 14);
  apply(fs);
  /* tutto dentro la finestra: se la pagina scorre, abbassa lo schermo */
  var other = document.documentElement.scrollHeight - screen.offsetHeight;
  var maxH = window.innerHeight - other;
  if (fs * 25 > maxH) apply(Math.max(maxH / 25, 9));
}
measure(); fit();
if (document.fonts && document.fonts.load) document.fonts.load('20px VT323').then(function(){ measure(); fit(); });
window.addEventListener('resize', fit);

/* ===== Input ===== */
document.addEventListener('click', function(e){
  if (e.target.closest('#hdr')) { go(100); return; }
  var t = e.target.closest('[data-go],[data-d],[data-f],#prev,#next,#home,#hold,#lang'); if (!t) return;
  if (t.hasAttribute('data-go')) go(t.getAttribute('data-go'));
  else if (t.hasAttribute('data-d')) digit(t.getAttribute('data-d'));
  else if (t.hasAttribute('data-f')) { var f = fastFor(state.page)[+t.getAttribute('data-f')]; if (f) go(f[0]); }
  else if (t.id === 'lang') go(LANG === 'en' ? 'it' : 'en');
  else if (t.id === 'prev') step(-1);
  else if (t.id === 'next') step(1);
  else if (t.id === 'home') go(100);
  else if (t.id === 'hold') { state.hold = !state.hold; t.innerHTML = state.hold ? HOLD_PLAY : HOLD_PAUSE; applyUI(); }
});
document.addEventListener('keydown', function(e){
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^[0-9]$/.test(e.key)) { digit(e.key); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { step(1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { step(-1); e.preventDefault(); }
  else if (e.key === 'Escape') { state.typed = ''; render(); }
});
function fromHash(){ var m = /^#p(\d{3})(?:\/(en|it))?$/.exec(location.hash); return m ? { n: +m[1], l: m[2] || null } : null; }
window.addEventListener('hashchange', function(){ var h = fromHash(); if (!h || state.hunting) return;
  var l = h.l || 'it'; if (l !== LANG) setLang(l, false);
  if (h.n !== state.page || l) { state.page = h.n; render(); } });
(function(){
  var h = fromHash();
  if (h) LANG = h.l || 'it';
  buildPages(); mkD(); applyUI();
  state.page = h ? h.n : (LANG_SAVED ? 100 : 0);
  if (state.page === 200) state.subStart = performance.now();
  try { history.replaceState(null, '', hashFor(state.page)); } catch (e) {}
  render();
})();
})();
