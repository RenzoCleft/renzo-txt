<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renzo Averia · Product designer a Milano</title>
<meta name="description" content="Renzo Averia, product designer a Milano: UX/UI, design system e CRM. Il portfolio come un lettore mp3.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/favicon-32.png?v=3" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
<link rel="shortcut icon" href="/favicon.ico?v=3">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=VT323&display=swap">
<style>
/* renzo.fm: il portfolio come un lettore mp3 anni 2000. A sinistra il lettore (si naviga con la rotella o con le frecce),
   a destra il libretto: il testo completo di quello che hai scelto, leggibile come una pagina normale. */
:root{
  --bg:#ffffff; --paper:#ffffff; --ink:#1d1d1f; --ink-2:#6e6e73; --line:#e3e3e3; --lcd-ink:#0b2540; --lcd-hi:#bfe3f7; --focus:#1f4fd1;
  --sans:'Onest', 'Helvetica Neue', Helvetica, Arial, sans-serif; --mono:'Onest', 'Helvetica Neue', Helvetica, Arial, sans-serif; --lcd:'VT323', ui-monospace, monospace;
  color-scheme: light;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.47 var(--sans);letter-spacing:-.022em;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;}
a{color:inherit;text-underline-offset:3px;text-decoration-thickness:1px;}
a:hover{text-decoration-thickness:2px;}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;}
.skip{position:absolute;left:-999px;top:8px;z-index:50;background:var(--ink);color:#fff;padding:10px 14px;font:500 15px var(--mono);}
.skip:focus{left:8px;}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

header.top{max-width:1120px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.logo{font:600 17px var(--sans);letter-spacing:-.02em;text-decoration:none;color:var(--ink);}
.tools{display:flex;gap:8px;font:400 14px var(--mono);}
.tools button,.tools a{font:inherit;color:var(--ink);background:none;border:0;padding:6px 0 6px 14px;text-decoration:underline;text-underline-offset:4px;min-height:36px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;}
.tools button:hover,.tools a:hover{text-decoration-thickness:2px;}

.stage{max-width:1120px;margin:0 auto;padding:12px 24px 48px;display:grid;grid-template-columns:380px minmax(0,1fr);gap:56px;align-items:start;}
.left{position:sticky;top:20px;display:flex;flex-direction:column;align-items:center;gap:14px;}

/* Il lettore */
.mp3{width:360px;max-width:100%;border-radius:36px;padding:26px 24px 28px;
  background:repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 1px, rgba(0,0,0,.035) 1px 2px), linear-gradient(180deg, #e9ebee 0%, #c3c7cd 55%, #a9aeb5 100%);
  box-shadow:0 30px 50px -18px rgba(0,0,0,.45), 0 2px 0 #fff inset, 0 -3px 6px rgba(0,0,0,.18) inset, 0 0 0 1px #8d9299;
  display:flex;flex-direction:column;align-items:center;gap:24px;}
.brandrow{width:100%;display:flex;justify-content:space-between;font:400 11px var(--mono);letter-spacing:.18em;color:#4a4f57;text-shadow:0 1px 0 rgba(255,255,255,.7);}
.bezel{width:100%;border-radius:10px;padding:10px;background:#2b2f36;box-shadow:0 2px 3px rgba(0,0,0,.5) inset, 0 1px 0 rgba(255,255,255,.8);}
.lcd{position:relative;height:236px;border-radius:4px;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%, #bfe3f7 0%, #8cc3e6 70%, #6fa9d3 100%);
  color:var(--lcd-ink);font:22px/1.05 var(--lcd);padding:8px 10px;display:flex;flex-direction:column;gap:6px;}
.lcd:focus-visible{outline:3px solid #ffd400;outline-offset:2px;}
.lcd::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg, rgba(11,37,64,.06) 0 1px, transparent 1px 3px);}
.bar{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--lcd-ink);padding-bottom:3px;font-size:19px;}
.batt{display:inline-flex;align-items:center;gap:6px;}
.batt i{display:inline-flex;width:22px;height:11px;border:2px solid var(--lcd-ink);padding:1px;}
.batt i::before{content:"";width:70%;background:var(--lcd-ink);}
.batt b{width:2px;height:5px;background:var(--lcd-ink);}
.rows{list-style:none;margin:0;padding:0;}
.rows li button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;width:100%;padding:1px 4px;cursor:pointer;font:22px/1.08 var(--lcd);color:var(--lcd-ink);}
.rows li button[aria-current="true"]{background:var(--lcd-ink);color:var(--lcd-hi);}
.rows li button > span:first-child{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
/* voce evidenziata troppo lunga: scorre come sugli mp3, poi torna all'inizio */
.mq{display:block;overflow:hidden;white-space:nowrap;min-width:0;}
.mq > b{display:inline-block;font-weight:inherit;}
.mq.run > b{animation:mq var(--mq-t, 6s) linear infinite;}
@keyframes mq{0%,18%{transform:translateX(0);}72%,90%{transform:translateX(var(--mq-dx));}100%{transform:translateX(0);}}
@media (prefers-reduced-motion: reduce){ .mq.run > b{animation:none;} .mq{text-overflow:ellipsis;} }
.rows li button:focus-visible{outline:2px solid #ffd400;outline-offset:-2px;}
.now{display:flex;flex-direction:column;gap:3px;}
.now .t{font-size:30px;line-height:1;}
.prog{margin-top:8px;height:10px;border:2px solid var(--lcd-ink);padding:1px;}
.prog i{display:block;height:100%;background:var(--lcd-ink);}
.times{display:flex;justify-content:space-between;font-size:19px;}
.hint{font-size:19px;margin-top:auto;}
.big{flex:1;display:flex;flex-direction:column;justify-content:center;}
.segs{display:flex;gap:4px;padding-top:2px;}
.segs i{flex:1;height:5px;background:rgba(11,37,64,.25);}
.segs b{display:block;height:100%;background:var(--lcd-ink);}
.big .sub{font-size:19px;margin-top:4px;opacity:.85;}
.wr-t .n2{font-size:40px;line-height:.95;}
.boot{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;}
.boot .logo-lcd{font-size:38px;line-height:1;}
.boot .load{width:70%;height:12px;border:2px solid var(--lcd-ink);padding:1px;}
.boot .load i{display:block;height:100%;width:0;background:var(--lcd-ink);animation:load 1.8s steps(12) forwards;}
@keyframes load{to{width:100%;}}
@media (prefers-reduced-motion: reduce){ .boot .load i{animation-duration:.4s;} }
.big .n{font-size:100px;line-height:.85;font-variant-numeric:tabular-nums;}

/* Rotella */
.wheel{position:relative;width:204px;height:204px;border-radius:50%;background:linear-gradient(180deg, #f4f5f7 0%, #cdd1d6 100%);
  box-shadow:0 6px 12px -4px rgba(0,0,0,.35), 0 1px 0 #fff inset, 0 -2px 4px rgba(0,0,0,.12) inset;}
.wheel button{position:absolute;border:0;background:none;color:#3d424a;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:12px;font:500 11px var(--mono);letter-spacing:.1em;}
.wheel button:hover{color:#000;}
.wheel .up{left:74px;top:6px;width:56px;height:54px;} .wheel .down{left:74px;bottom:6px;width:56px;height:54px;}
.wheel .menu{left:4px;top:74px;width:58px;height:56px;} .wheel .play{right:4px;top:74px;width:58px;height:56px;}
.wheel .ok{left:63px;top:63px;width:78px;height:78px;border-radius:50%;background:linear-gradient(180deg, #b9bec5 0%, #e4e7ea 100%);box-shadow:0 1px 2px rgba(0,0,0,.35) inset, 0 1px 0 #fff;font-size:13px;}
.wheel svg{fill:currentColor;}
.slot{width:60px;height:6px;border-radius:3px;background:#8d9299;box-shadow:0 1px 1px rgba(0,0,0,.4) inset;}
.keys{margin:0;font:400 13px/1.5 var(--mono);color:var(--ink-2);text-align:center;max-width:360px;}
.keys kbd{font:inherit;color:var(--ink);}
.sp{width:360px;max-width:100%;}
.sp iframe{display:block;width:100%;height:80px;border:0;}

/* Libretto */
.booklet{padding:8px 0 40px;max-width:640px;}
.booklet:focus{outline:none;}
.kick{font:400 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:0 0 12px;}
.booklet h1,.booklet h2.title{font:600 clamp(34px, 4.4vw, 56px)/1.07 var(--sans);letter-spacing:-.028em;margin:0 0 12px;}
.booklet h1:focus,.booklet h2.title:focus{outline:none;}
.booklet h3{font:600 19px/1.3 var(--sans);margin:28px 0 6px;}
.booklet h4{font:600 21px/1.2 var(--sans);letter-spacing:-.02em;margin:40px 0 12px;}
.booklet p{margin:0 0 14px;max-width:62ch;}
.lede{font-size:21px;line-height:1.38;color:var(--ink-2);}
.lede strong{color:var(--ink);font-weight:500;}
.result{display:inline;background:var(--lcd-hi);color:var(--lcd-ink);padding:2px 6px;box-decoration-break:clone;-webkit-box-decoration-break:clone;font-weight:500;}
dl.credits{display:grid;grid-template-columns:90px minmax(0,1fr);gap:6px 16px;margin:26px 0 0;font-size:16px;border-top:1px solid var(--line);padding-top:14px;}
dl.credits dt{font:400 14px/1.7 var(--mono);color:var(--ink-2);}
dl.credits dd{margin:0;}
figure{margin:28px 0 0;}
figure img{display:block;width:100%;height:auto;background:#f4f4f4;}
figure.narrow img{max-width:300px;} figure.mid img{max-width:480px;}
figcaption{font-size:14px;color:var(--ink-2);margin-top:8px;}
.proto{display:inline-flex;align-items:center;gap:8px;margin-top:24px;min-height:44px;padding:10px 0;border:0;color:var(--ink);text-decoration:underline;text-underline-offset:4px;font:500 16px var(--sans);}
.proto:hover{text-decoration-thickness:2px;}
.note{font:400 14px var(--mono);color:var(--ink-2);border-left:3px solid var(--lcd-ink);padding-left:12px;margin-top:24px;}
.stats{list-style:none;margin:0;padding:0;}
.stats li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;align-items:baseline;border-top:1px solid var(--line);padding:14px 0;}
.stats strong{font:700 56px/1 var(--sans);letter-spacing:-.04em;color:var(--ink);}
.cv{list-style:none;margin:0;padding:0;}
.cv li,.contact li{display:grid;grid-template-columns:100px minmax(0,1fr);gap:16px;padding:9px 0;border-bottom:1px solid var(--line);}
.cv .y,.contact span{font:400 14px/1.9 var(--mono);color:var(--ink-2);}
.contact{list-style:none;margin:0;padding:0;}
.contact a{overflow-wrap:anywhere;}
.alltracks{list-style:none;margin:20px 0 0;padding:0;border-top:1px solid var(--line);}
.alltracks li{border-bottom:1px solid var(--line);}
.alltracks button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;width:100%;padding:12px 4px;cursor:pointer;}
.alltracks button:hover .t{text-decoration:underline;}
.alltracks button:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
.alltracks .n,.alltracks .d{font:400 14px/1.8 var(--mono);color:var(--ink-2);}
.alltracks .t{font-weight:600;}
.alltracks .c{display:block;color:var(--ink-2);font-size:15px;}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:40px;flex-wrap:wrap;}
.pn button{font:500 16px var(--sans);color:var(--ink);background:none;border:0;padding:10px 0;min-height:44px;cursor:pointer;text-decoration:underline;text-underline-offset:4px;}
.pn button:hover{text-decoration-thickness:2px;}

footer{max-width:1120px;margin:0 auto;padding:20px 24px 32px;border-top:1px solid var(--line);font:400 14px var(--mono);color:var(--ink-2);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;}

@media (max-width: 900px){
  .stage{grid-template-columns:1fr;gap:28px;padding-left:16px;padding-right:16px;}
  header.top,footer{padding-left:16px;padding-right:16px;}
  .left{position:static;}
  .booklet{padding:0 0 32px;}
}
@media (max-width: 400px){
  .mp3{padding:20px 16px 22px;gap:18px;border-radius:30px;}
  .lcd{height:216px;}
}
</style>
</head>
<body>
<a class="skip" href="#libretto" id="skip">Vai al testo</a>
<header class="top">
  <a class="logo" href="index.html" id="logo">Renzo Averia</a>
  <div class="tools">
    <button type="button" id="lang" lang="en" aria-label="Read in English">EN</button>
    <a href="index.html" id="tochoice">Cambia esperienza</a>
  </div>
</header>

<main class="stage">
  <div class="left">
    <section class="mp3" id="mp3" aria-label="Lettore mp3">
      <div class="bezel">
        <div class="lcd" id="lcd" tabindex="0" role="group" aria-roledescription="schermo" aria-label="Schermo del lettore"></div>
      </div>
      <div class="wheel" role="group" aria-label="Rotella" id="wheel">
        <button type="button" class="up" id="bUp"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"><path d="M12 6l8 10H4z"/></svg></button>
        <button type="button" class="down" id="bDown"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"><path d="M12 18L4 8h16z"/></svg></button>

        <button type="button" class="play" id="bPlay" aria-pressed="false"><svg aria-hidden="true" width="22" height="16" viewBox="0 0 30 24"><path d="M2 4l11 8-11 8z"/><rect x="17" y="4" width="4" height="16"/><rect x="24" y="4" width="4" height="16"/></svg></button>
        <button type="button" class="ok" id="bOk">OK</button>
      </div>
    </section>
    <div class="sp" id="sp"></div>
  </div>
  <article class="booklet" id="libretto" tabindex="-1" aria-live="off"></article>
</main>
<p class="vh" aria-live="polite" id="say"></p>

<footer>

  <span><a href="index.html" id="fchoice">Torna alla scelta</a> · <a href="tv.html#p100/it" id="ftv">Prova la versione televideo</a></span>
</footer>

  if (st.mode === 'boot') return;
  if (st.mode === 'menu') { st.mode = MODES[st.sel]; st.sel = 0; st.w = 0; if (st.mode === 'wrapped') wrStart(); draw(); say(U[lang].opened + U[lang].head[st.mode]); }
  else if (st.mode === 'wrapped' && st.w === WR[lang].length - 1) { st.mode = 'tracks'; st.sel = 0; draw(); say(U[lang].opened + U[lang].head.tracks); }
  else if (st.mode === 'tracks') { st.mode = 'now'; st.i = st.sel; draw(); say(U[lang].head.now + ': ' + ALL()[st.i].d.t); }
  else if (st.mode === 'radio') { playSong(st.sel); say(SONGS[st.sel][1] + ', ' + SONGS[st.sel][2]); }
  else { readIt(); }
}
function menu(){ if (st.mode === 'boot') return; var from = st.mode; st.mode = 'menu'; st.sel = Math.max(0, MODES.indexOf(from === 'now' ? 'tracks' : from)); draw(); say(U[lang].head.menu + ': ' + U[lang].menu[st.sel]); }
/* porta il fuoco sul titolo del libretto, per leggere tutto */
function readIt(){ var t = $('libretto').querySelector('h1,h2'); $('libretto').scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); if (t) t.focus({ preventScroll: true }); }

$('bUp').onclick = function(){ move(-1); };
$('bDown').onclick = function(){ move(1); };
$('bMenu').onclick = menu;
$('bOk').onclick = ok;
$('bPlay').onclick = music;
/* clic sulle righe dello schermo: seleziona e apre */
$('lcd').addEventListener('click', function(e){ var b = e.target.closest('[data-j]'); if (!b) return; st.sel = +b.getAttribute('data-j'); ok(); $('lcd').focus(); });
/* frecce e tasti quando il fuoco è sul lettore */
$('mp3').addEventListener('keydown', function(e){
  var k = e.key;
  if (k === 'ArrowUp' || k === 'ArrowLeft' && st.mode === 'now') { e.preventDefault(); move(-1); }
  else if (k === 'ArrowDown' || k === 'ArrowRight' && st.mode === 'now') { e.preventDefault(); move(1); }
  else if ((k === 'Enter' || k === ' ') && e.target === $('lcd')) { e.preventDefault(); ok(); }
  else if (k === 'Escape' || k === 'Backspace') { e.preventDefault(); menu(); }
});
/* dal libretto: apri un brano, vai avanti/indietro, accendi la radio */
$('libretto').addEventListener('click', function(e){
  var o = e.target.closest('[data-open],[data-go]'), r = e.target.closest('[data-song]');
  if (r) { st.mode = 'radio'; st.sel = +r.getAttribute('data-song'); playSong(st.sel); return; }
  if (!o) return;
  st.mode = 'now'; st.i = +(o.getAttribute('data-open') || o.getAttribute('data-go')); st.sel = st.i; draw(); readIt();
});

/* ===== Musica: la playlist di Spotify, solo se la chiedi ===== */
var SONGS = [
  ['1SOTqkhpIWoLX1AS9Y2RpU', 'Coconut Mall', 'Mario Kart Wii'], ['3Hz95hAWqdsk1801kiR5yv', 'Aaron', 'Paul Kalkbrenner'], ['39piMAGrzEeTV0yAxHRyoA', 'Veridis Quo', 'Daft Punk'],
  ['5Hf2h59YLInKlic7ooWZVd', 'Roygbiv', 'Boards of Canada'], ['1fmoCZ6mtMiqA5GHWPcZz9', 'A New Error', 'Moderat'], ['5DAjrJqXqYtgr67pVhmUeR', 'Kerala', 'Bonobo'],
  ['0RAXoT7hwOoqAXI95ryxT5', 'Rydeen', 'Yellow Magic Orchestra'], ['14vNAdDw1Otn52iFtn4qRS', 'Chase', 'Giorgio Moroder'], ['2fwVnifj9tP17FAtT3Lsq3', 'Innerbloom XI', 'R\u00dcF\u00dcS DU SOL']
];
var mus = { on: false, ctrl: null, loading: false, cur: -1 };
/* una canzone della lista: la prima volta carica il lettore di Spotify, poi cambia brano */
function playSong(i){
  if (mus.ctrl) { if (mus.cur === i) { mus.ctrl.togglePlay(); mus.on = !mus.on; } else { mus.cur = i; mus.ctrl.loadUri('spotify:track:' + SONGS[i][0]); mus.ctrl.play(); mus.on = true; } return syncPlay(); }
  mus.cur = i; music();
}
function music(){
  if (mus.ctrl) { mus.ctrl.togglePlay(); mus.on = !mus.on; return syncPlay(); }
  if (mus.loading) return; mus.loading = true; if (mus.cur < 0) mus.cur = st.mode === 'radio' ? st.sel : 0;
  var tgt = document.createElement('div'); $('sp').appendChild(tgt);
  window.onSpotifyIframeApiReady = function(API){
    API.createController(tgt, { uri: 'spotify:track:' + SONGS[mus.cur][0], width: '100%', height: 80, theme: 'dark' }, function(c){
      mus.ctrl = c; mus.loading = false; c.play(); mus.on = true; syncPlay();
      c.addListener('playback_update', function(e){ var p = !!(e && e.data && e.data.isPaused); if (mus.on === p) { mus.on = !p; syncPlay(); } });
    });
  };
  var s = document.createElement('script'); s.src = 'https://open.spotify.com/embed/iframe-api/v1'; s.async = true;
  s.onerror = function(){ mus.loading = false; $('sp').innerHTML = '<p class="keys"><a href="https://open.spotify.com/playlist/3rUsoHodaIIiOfgqhhZRYR" target="_blank" rel="noopener">Spotify ↗</a></p>'; };
  document.body.appendChild(s);
}
function syncPlay(){
  var L = U[lang], b = $('bPlay'); b.setAttribute('aria-pressed', String(mus.on)); b.setAttribute('aria-label', mus.on ? L.pause : L.play); b.title = b.getAttribute('aria-label');
  lcd(); if (st.mode === 'radio') booklet();
}

/* ===== Testi fissi e lingua ===== */
function chrome(save){
  var L = U[lang], en = lang === 'en';
  document.documentElement.lang = lang;
  document.title = S[lang].meta[0]; document.querySelector('meta[name="description"]').content = S[lang].meta[1];
  $('skip').textContent = L.skip; $('tochoice').textContent = L.choice; $('fchoice').textContent = L.fchoice; $('ftv').textContent = L.ftv; $('ftv').href = 'tv.html#p100/' + lang;
  $('mp3').setAttribute('aria-label', L.player); $('wheel').setAttribute('aria-label', L.wheel); $('lcd').setAttribute('aria-label', L.lcdLabel);
  [['bUp', L.up], ['bDown', L.down], ['bMenu', L.mn], ['bOk', L.ok]].forEach(function(p){ $(p[0]).setAttribute('aria-label', p[1]); $(p[0]).title = p[1]; });
  $('logo').setAttribute('aria-label', 'Renzo Averia, ' + L.fchoice);
  var b = $('lang'); b.textContent = en ? 'IT' : 'EN'; b.setAttribute('lang', en ? 'it' : 'en'); b.setAttribute('aria-label', en ? 'Leggi in italiano' : 'Read in English');
  syncPlay();
  if (save) { try { localStorage.setItem('renzo-txt-lang', lang); } catch (e) {} try { history.replaceState(null, '', '?lang=' + lang); } catch (e) {} }
}
$('lang').addEventListener('click', function(){ lang = lang === 'en' ? 'it' : 'en'; chrome(true); draw(); });
$('skip').addEventListener('click', function(e){ e.preventDefault(); readIt(); });
chrome(false); draw();
/* schermata di avvio: il lettore si accende, poi compare il menu */
setTimeout(function(){ st.mode = 'menu'; lcd(); say(U[lang].head.menu + ': ' + U[lang].menu[0]); }, matchMedia('(prefers-reduced-motion: reduce)').matches ? 500 : 2000);
})();
</script>
